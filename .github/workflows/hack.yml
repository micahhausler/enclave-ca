name: hack

# Checks the Python under hack/ (the docs diagram generator). Runs only when it, or this workflow, changes.
on:
  push:
    branches: [main]
    paths:
      - "hack/**.py"
      - ".github/workflows/hack.yml"
  pull_request:
    paths:
      - "hack/**.py"
      - ".github/workflows/hack.yml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile
        run: python3 -m py_compile hack/*.py
      - name: Lint
        run: pipx run --spec ruff==0.16.9 ruff check --isolated --select E4,E7,E9,F,B,C4 hack/
      - name: Install librsvg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin
      - name: Draw and render every diagram
        run: python3 hack/diagrams.py --svg-dir "$RUNNER_TEMP/svg" --out-dir "$RUNNER_TEMP/png"
      - name: Check the output
        run: |
          python3 - "$RUNNER_TEMP" <<'PY'
          import glob, os, re, sys, xml.etree.ElementTree as ET
          tmp = sys.argv[1]
          svgs = sorted(glob.glob(f"{tmp}/svg/*.svg"))
          pngs = sorted(glob.glob(f"{tmp}/png/*.png"))
          for f in svgs:
              ET.parse(f)  # well-formed XML
          for f in pngs:
              with open(f, "rb") as fh:
                  assert fh.read(8) == b"\x89PNG\r\n\x1a\n", f"{f} is not a PNG"
          # every diagram the docs embed has a light and a dark PNG
          embedded = set()
          for doc in ["README.md"] + glob.glob("docs/*.md"):
              embedded |= set(re.findall(r'img/([\w.@-]+\.png)', open(doc).read()))
          rendered = {os.path.basename(p) for p in pngs}
          missing = embedded - rendered
          assert not missing, f"docs embed PNGs the generator doesn't make: {sorted(missing)}"
          print(f"{len(svgs)} SVGs and {len(pngs)} PNGs; the docs embed {len(embedded)}")
          PY
